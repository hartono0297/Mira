name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Simpan cache walau tes gagal, supaya run berikutnya tidak mengompilasi ulang semua.
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          # package-lock: vite 8 dan vitest 5 butuh Node ^20.19 || ^22.12 || >=24.
          node-version: 22
          cache: npm

      - name: Pasang dependensi npm
        run: npm ci

      # Langkah berikut tetap jalan walau satu gagal, supaya semua masalah terlihat dalam satu run.
      - name: Cek tipe TypeScript
        run: npx tsc --noEmit

      - name: Tes frontend (vitest)
        if: ${{ !cancelled() }}
        run: npx vitest run --pool=threads

      # Skrip rilis updater (latest.json dan pemeriksa .sig). Node 22 belum menerima folder, jadi pakai glob.
      - name: Tes skrip rilis
        if: ${{ !cancelled() }}
        run: node --test "scripts/release/*.test.mjs"

      # tauri::generate_context! mewajibkan folder frontendDist (../dist) ada saat kompilasi.
      - name: Build frontend untuk konteks Tauri
        if: ${{ !cancelled() }}
        run: npx vite build

      # macOS hanya punya 127.0.0.1 di lo0. Tes banjir handshake di src/network/tests.rs
      # memakai 127.0.0.2 sebagai alamat penyerang, jadi alamat itu ditambahkan dulu.
      - name: Alias loopback 127.0.0.2 (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      - name: cargo test
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        run: cargo test

      - name: cargo clippy
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
