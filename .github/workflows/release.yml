name: Rilis

on:
  push:
    tags: ["v*"]
    # Uji build installer (tanpa rilis) saat konfigurasi paket berubah di cabang mana pun.
    # Filter paths tidak berlaku untuk push tag.
    branches: ["**"]
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/tauri.*.conf.json
      - src-tauri/Info.plist
  workflow_dispatch:
    inputs:
      publish:
        description: "Buat draft rilis GitHub. Jika false, installer hanya diunggah sebagai artefak workflow (uji coba)."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rilis-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            rust_targets: ""
            args: "--bundles nsis"
            bundle_dir: src-tauri/target/release/bundle/nsis
            pattern: "*_x64-setup.exe"
            # install.ps1 mencari aset Mira_*_x64-setup.exe, jangan ubah nama ini.
            asset_suffix: "x64-setup.exe"
            artifact: mira-windows-x64
          - label: macOS universal
            os: macos-latest
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles app,dmg"
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle/dmg
            pattern: "*.dmg"
            asset_suffix: "universal.dmg"
            artifact: mira-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Baca versi aplikasi
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} tidak cocok dengan versi tauri.conf.json (v${VERSION})."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}

      - name: Pasang dependensi npm
        run: npm ci

      - name: Build installer
        run: npx tauri build ${{ matrix.args }}

      - name: Periksa bundle macOS (arsitektur, tanda tangan, Info.plist)
        if: runner.os == 'macOS'
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Mira.app
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/mira")
          echo "Arsitektur: $ARCHS"
          echo "$ARCHS" | grep -q arm64 && echo "$ARCHS" | grep -q x86_64
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature=adhoc|flags="
          PLIST="$APP/Contents/Info.plist"
          plutil -extract NSLocalNetworkUsageDescription raw "$PLIST"
          plutil -extract NSBonjourServices xml1 -o - "$PLIST" | grep -q "_mira._udp"
          plutil -extract LSMinimumSystemVersion raw "$PLIST"

      - name: Kumpulkan installer dengan nama tetap
        id: stage
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          files=( ${{ matrix.bundle_dir }}/${{ matrix.pattern }} )
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Harus ada tepat satu berkas ${{ matrix.pattern }} di ${{ matrix.bundle_dir }}, ditemukan ${#files[@]}."
            ls -la ${{ matrix.bundle_dir }} || true
            exit 1
          fi
          NAME="Mira_${{ steps.ver.outputs.version }}_${{ matrix.asset_suffix }}"
          cp "${files[0]}" "out/$NAME"
          cd out
          if command -v sha256sum >/dev/null; then sha256sum "$NAME" > "$NAME.sha256"; else shasum -a 256 "$NAME" > "$NAME.sha256"; fi
          ls -la
          cat "$NAME.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft rilis GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Buat atau perbarui draft rilis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="${GITHUB_REF_TYPE}"
          if [ "$TAG" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          ls -la out
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --draft --prerelease \
              --target "$GITHUB_SHA" \
              --title "Mira $TAG" \
              --notes "Installer Windows (x64, NSIS) dan macOS (universal, ad-hoc signed, tanpa notarisasi)."
          fi
