[package]
name = "mira"
version = "0.1.0"
description = "Mira, aplikasi kerja tim di jaringan kantor"
authors = ["Mira"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
keyring = { version = "3", features = ["windows-native"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
thiserror = "2.0.21"
hex = "0.4.3"
zeroize = "1.9.2"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
mdns-sd = "0.22.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
if-addrs = "0.15.0"
qrcode = "0.15.0"
blake3 = "1.8.7"
data-encoding = "2.11.1"
x509-parser = "0.18.1"
automerge = "0.12.0"
tauri-plugin-notification = "2"
notify = "9.0.0"
tauri-plugin-dialog = "2.8.4"
# Tahap 5 (tanda tangan PDF): kunci turunan PIN dan enkripsi gambar tanda tangan.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# Bukti stempel: mengurai PDF versi lama dan baru. Tanpa fitur bawaan (chrono, rayon).
lopdf = { version = "=0.47.0", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
winreg = "0.56.0"

# Argon2 dan BLAKE2 sangat lambat tanpa optimasi; tes dan `tauri dev` memakai
# profil dev, jadi keduanya dioptimasi juga di sana (hanya dua crate ini).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
